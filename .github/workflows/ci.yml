# フロントエンド CI (frontend/)
#
# トリガー: main 宛の PR と main への push のうち、frontend 配下（または本ファイル）に
#   変更があるときだけ。docs や tools のみの PR で Node のセットアップを回さないため。
#   ※ 必須ステータスチェックにする場合は paths フィルタと相性が悪い（対象外の PR で
#     チェックが「待機中」のままになる）ので、その際は paths を外すこと。
#
# 実行内容 (frontend を working-directory とする):
#   format:check (Prettier) -> lint (ESLint) -> test (vitest, utils のユニットテスト)
#   -> build (tsc -b の型チェック + Vite ビルド)
#
# バックエンド (backend/) の CI は現状なし。テストが無く、torch 等の依存が重いため見送り。

name: CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# 同一ブランチに連続 push したとき、古い実行はキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # npm ci: package-lock.json と package.json の不整合があれば失敗する。
      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build (TypeScript check + Vite build)
        run: npm run build
